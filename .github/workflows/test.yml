name: Tests & Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guardrail-tests:
    name: PII Guardrail Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run PII guardrail tests
        run: bun test lib/ai/__tests__/guardrail-detection.test.ts lib/ai/__tests__/token-vault.test.ts

      - name: Test summary
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ All PII guardrail tests passed!"
          else
            echo "❌ PII guardrail tests failed!"
            exit 1
          fi

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [guardrail-tests, code-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build
        env:
          # Add any required environment variables for build
          SKIP_ENV_VALIDATION: true
